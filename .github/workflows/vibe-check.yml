name: Vibe Check

on:
  # Run on PRs (one run per PR; superseded pushes auto-cancel) and on `main` for
  # post-merge validation. Plain feature-branch pushes do not trigger CI; open a PR.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # On pull_request, key on the PR number, so a new push cancels the older run. Why the run ID
  # for push and dispatch: a group keeps only one pending run, so a third push to main would
  # cancel the second one's queued post-merge run.
  group: vibe-check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DO_NOT_TRACK: 1

jobs:
  mise-lock-check:
    name: Mise Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Cache mise binary 🗃️
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/bin/mise
          key: mise-${{ runner.os }}-${{ hashFiles('scripts/install-mise') }}

      - name: Install mise 🔧
        run: |
          # Put the cached binary on PATH first so install-mise's version check finds it
          # and skips re-downloading the pinned release on a cache hit.
          export PATH="${HOME}/.local/bin:${PATH}"
          ./scripts/install-mise
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Verify mise.lock is in sync 🔒
        # mise lock looks up release metadata on api.github.com. The token lifts
        # the anonymous per-IP rate limit shared by the runner pool. mise lock
        # runs the PR's exec helper, so the workflow-level permissions must stay
        # contents: read.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Why the ls-files check: when a PR deletes mise.lock, `mise lock` makes an untracked file,
          # and `git diff` does not see it.
          git ls-files --error-unmatch mise.lock
          mise trust ./mise.toml
          mise lock
          if ! git diff --exit-code mise.lock; then
            echo "::error::mise.lock is out of sync with .nvmrc / package.json#packageManager."
            echo "::error::Run 'mise lock' locally and commit the result."
            exit 1
          fi

  # Why here, not in its own workflow: main requires only the vibe-check job, so this check must
  # gate it. A stale lockfile otherwise fails only when release.yml first runs on main.
  actions-lock-check:
    name: Actions Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install gh-actions-lock 🔧
        run: gh extension install github/gh-actions-lock --pin v0.5.1

      - name: Verify actions.lock is complete and current 🔒
        run: gh actions-lock --verify --fail-on-warning

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Use pnpm version from root package.json#packageManager
      - name: Install pnpm 📦
        uses: pnpm/action-setup@v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Dependencies 📥
        run: pnpm install --frozen-lockfile

      - name: Format Check 🎨
        run: pnpm run fmt:check

      - name: Lint 🔍
        run: pnpm run lint

      - name: Type Check 🔎
        run: pnpm run typecheck

      - name: Test 🧪
        run: pnpm run test

      - name: Ensure Package is Publishable 🧐
        # Run the prepublish hook to confirm the package builds and package.json is up to date.
        run: |
          pnpm run prepublishOnly
          git diff --exit-code

  vibe-check:
    name: vibe-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - mise-lock-check
      - actions-lock-check
      - checks
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Verify all vibe check jobs passed
        env:
          MISE_LOCK_CHECK_RESULT: ${{ needs.mise-lock-check.result }}
          ACTIONS_LOCK_CHECK_RESULT: ${{ needs.actions-lock-check.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          echo "mise-lock-check: $MISE_LOCK_CHECK_RESULT"
          echo "actions-lock-check: $ACTIONS_LOCK_CHECK_RESULT"
          echo "checks: $CHECKS_RESULT"

          if [[ "$MISE_LOCK_CHECK_RESULT" != "success" || "$ACTIONS_LOCK_CHECK_RESULT" != "success" || "$CHECKS_RESULT" != "success" ]]; then
            echo "One or more vibe check jobs did not succeed."
            exit 1
          fi
